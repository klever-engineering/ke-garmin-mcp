version: 2
updates:
  # uv.lock is the source of exact versions (ADR 0005); requirements.txt is
  # generated from it with `make lock`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # mcp 2.x is a code migration (FastMCP -> MCPServer), tracked in #22.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
