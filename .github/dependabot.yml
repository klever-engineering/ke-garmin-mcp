version: 2
updates:
  # uv.lock is the source of exact versions (ADR 0005); requirements.txt is
  # generated from it with `make lock`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
